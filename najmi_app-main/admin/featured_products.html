<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Products - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Featured Products Management</h1>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="products.html">Products</a>
                <a href="brands.html">Brands</a>
                <a href="featured_products.html" class="active">Featured Products</a>
                <a href="featured_brands.html">Featured Brands</a>
                <a href="image_slides.html">Image Slides</a>
            </nav>
        </header>

        <main>
            <section class="featured-products-section">
                <div class="section-header">
                    <h2>Featured Products</h2>
                    <button id="addFeaturedProductBtn" class="btn btn-primary">Add Featured Product</button>
                </div>

                <div class="featured-products-list" id="featuredProductsList">
                    <!-- Featured products will be loaded here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Featured Product Modal -->
    <div id="featuredProductModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Featured Product</h2>
            <form id="featuredProductForm">
                <div class="form-group">
                    <label for="productSelect">Select Product:</label>
                    <select id="productSelect" required>
                        <option value="">Choose a product...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sortOrder">Sort Order:</label>
                    <input type="number" id="sortOrder" min="0" value="0" required>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="isActive" checked>
                        Active
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/featured_products.js"></script>
</body>
</html>
