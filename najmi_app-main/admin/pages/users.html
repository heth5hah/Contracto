<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contracto Admin - Users</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="../js/theme.js"></script>
</head>
<body class="dashboard-page">
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="../assets/images/contracto.png" alt="Contracto Logo" class="sidebar-logo">
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="ri-arrow-left-line"></i>
            </button>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="dashboard.html">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="products.html">
                    <i class="ri-shopping-bag-line"></i>
                    <span>Products</span>
                </a>
            </li>
            <li>
                <a href="brands.html">
                    <i class="ri-bookmark-line"></i>
                    <span>Brands</span>
                </a>
            </li>
            <li>
                <a href="quotations.html">
                    <i class="ri-file-list-line"></i>
                    <span>Quotations</span>
                </a>
            </li>
            <li class="active">
                <a href="users.html">
                    <i class="ri-user-line"></i>
                    <span>Users</span>
                </a>
            </li>
            <li>
                <a href="settings.html">
                    <i class="ri-settings-line"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="user-welcome">
                <span>Hey <span id="userName"></span></span>
            </div>
            <div class="search-bar">
                <i class="ri-search-line"></i>
                <input type="text" id="searchUsers" placeholder="Search users...">
            </div>
            <div class="user-menu">
                <span id="userEmail"></span>
            </div>
        </header>

        <div class="content-header">
            <h1>Users</h1>
            <button class="btn-primary" onclick="openAddUserModal()">
                <i class="ri-add-line"></i>
                Add User
            </button>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>PAN</th>
                            <th>GST Number</th>
                            <th>Credit Limit</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add User</h2>
                <button onclick="closeUserModal()" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <div class="form-group">
                        <label for="userName">Name</label>
                        <input type="text" id="userName" required>
                    </div>
                    <div class="form-group">
                        <label for="userMobile">Mobile</label>
                        <input type="tel" id="userMobile" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">Email</label>
                        <input type="email" id="userEmail">
                    </div>
                    <div class="form-group">
                        <label for="userPan">PAN</label>
                        <input type="text" id="userPan" required>
                    </div>
                    <div class="form-group">
                        <label for="userGst">GST Number</label>
                        <input type="text" id="userGst">
                    </div>
                    <div class="form-group">
                        <label for="creditLimit">Credit Limit</label>
                        <input type="number" id="creditLimit" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="userStatus">Status</label>
                        <select id="userStatus" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" onclick="closeUserModal()" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Save User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/users.js"></script>
</body>
</html>
