<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slides - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Image Slides Management</h1>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="products.html">Products</a>
                <a href="brands.html">Brands</a>
                <a href="featured_products.html">Featured Products</a>
                <a href="featured_brands.html">Featured Brands</a>
                <a href="image_slides.html" class="active">Image Slides</a>
            </nav>
        </header>

        <main>
            <section class="image-slides-section">
                <div class="section-header">
                    <h2>Image Slides</h2>
                    <button id="addSlideBtn" class="btn btn-primary">Add New Slide</button>
                </div>

                <div class="slides-preview">
                    <h3>Current Slides Preview</h3>
                    <div class="slides-container" id="slidesPreview">
                        <!-- Slides preview will be shown here -->
                    </div>
                </div>

                <div class="slides-list" id="slidesList">
                    <!-- Slides list will be loaded here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Slide Modal -->
    <div id="slideModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add New Slide</h2>
            <form id="slideForm">
                <div class="form-group">
                    <label for="slideTitle">Title:</label>
                    <input type="text" id="slideTitle" placeholder="Enter slide title">
                </div>
                <div class="form-group">
                    <label for="slideDescription">Description:</label>
                    <textarea id="slideDescription" placeholder="Enter slide description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="slideImageUrl">Image URL:</label>
                    <input type="url" id="slideImageUrl" placeholder="https://example.com/image.jpg" required>
                </div>
                <div class="form-group">
                    <label for="slideLinkUrl">Link URL (Optional):</label>
                    <input type="url" id="slideLinkUrl" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label for="slideBrand">Associated Brand (Optional):</label>
                    <select id="slideBrand">
                        <option value="">Select a brand...</option>
                        <!-- Brands will be loaded dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="slideSortOrder">Sort Order:</label>
                    <input type="number" id="slideSortOrder" min="0" value="0" required>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="slideIsActive" checked>
                        Active
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeSlideModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/image_slides.js"></script>
</body>
</html>
